# Full early-alpha stack: Postgres + Redis + API (+ workers/bots) + Admin UI
#
#   cp docker.env.example .env   # edit secrets
#   docker compose up -d --build
#
# Admin UI  → http://localhost:3000
# API       → http://localhost:4000/health
#
# Infra only (local npm dev):
#   docker compose up -d postgres redis

name: early-alpha

services:
  postgres:
    image: postgres:16-alpine
    container_name: early-alpha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: early-alpha-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: early-alpha-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-long-random-string}
      PORT: "4000"
      NODE_ENV: production
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      # Chainlist / runtime snapshots
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: early-alpha-admin
    restart: unless-stopped
    environment:
      # Server-side BFF → API (Docker network DNS name)
      BACKEND_URL: ${BACKEND_URL:-http://api:4000}
      BACKEND_API_KEY: ${ADMIN_API_KEY:-change-me-long-random-string}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  api_data:
